# Backend RTConnect terhubung ke Supabase (PostgreSQL + Storage). Tidak ada MySQL lagi.
# Siapkan backend/.env (salin dari backend/.env.example), lalu: docker compose up --build
services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      APP_ENV: development
    ports:
      - "5000:5000"
    command: ["sh", "-c", "python -m database.migrate && python -m database.seed && exec gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:5000 app:app"]
