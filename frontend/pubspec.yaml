name: rtconnect
description: "RTConnect - Aplikasi Administrasi Warga RT/RW dengan Flutter dan Flask"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^14.0.0

  # Networking & REST API
  dio: ^5.4.1
  http: ^1.2.0

  # Local Storage & Encryption
  flutter_secure_storage: ^10.0.0

  # Document Preview, QR & Signature
  syncfusion_flutter_pdfviewer: ^27.2.5
  qr_flutter: ^4.1.0
  file_picker: ^8.0.0
  cupertino_icons: ^1.0.8

  # Utilities & Deep Linking
  intl: ^0.19.0
  url_launcher: ^6.2.5
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
