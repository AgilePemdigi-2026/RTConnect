name: Sprint 1 BDD Testing (Gherkin)
run-name: "Sprint 1 BDD — Backend Gherkin Test Suite (#${{ github.run_number }})"

on:
  push:
    branches: [main, feat/sprint1-bdd-actions]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sprint1-bdd:
    name: Sprint 1 BDD - Behave Gherkin Execution
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rtconnect_ci
          POSTGRES_PASSWORD: ci_local_password_only
          POSTGRES_DB: rtconnect_bdd
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rtconnect_ci -d rtconnect_bdd"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      STORAGE_BACKEND: local
      SEED_DEMO_USERS: 'true'
      SUPABASE_DB_URL: postgresql://rtconnect_ci:ci_local_password_only@127.0.0.1:5432/rtconnect_bdd
      RT_WHATSAPP_NUMBER: '6281234567890'
      DB_TIMEZONE: Asia/Jakarta
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize PostgreSQL Schema, Migrations & Seed Data
        working-directory: backend
        run: |
          python - <<'EOF'
          from pathlib import Path
          from database.db import close_pool, get_pool

          sql = Path('database/supabase_sql/000_base_schema.sql').read_text(encoding='utf-8')
          pool = get_pool()
          try:
              with pool.connection() as conn:
                  conn.execute(sql)
              print('[OK] 000_base_schema.sql applied')
          finally:
              close_pool()
          EOF
          python -m database.migrate
          python -m database.seed

      - name: Run Sprint 1 BDD Gherkin Suite
        id: bdd
        working-directory: backend
        run: |
          mkdir -p test-reports/junit
          set +e
          python -u run_bdd.py \
            --no-color \
            --format pretty --outfile - \
            --format json.pretty --outfile test-reports/bdd-report.json \
            --junit --junit-directory test-reports/junit \
            2>&1 | tee test-reports/bdd-console.log
          BDD_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$BDD_EXIT" >> "$GITHUB_OUTPUT"
          exit $BDD_EXIT

      - name: Publish Sprint 1 BDD Results to Actions Summary
        if: always()
        working-directory: backend
        run: |
          python - <<'EOF'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ['GITHUB_STEP_SUMMARY'])
          report_path = Path('test-reports/bdd-report.json')
          console_path = Path('test-reports/bdd-console.log')
          exit_code = os.environ.get('BDD_EXIT_CODE', 'unknown')

          lines = [
              '# Hasil Pengujian Sprint 1 BDD (Gherkin)',
              '',
              f'- **Status Eksekusi:** `{"PASSED" if exit_code == "0" else "FAILED"}` (exit code `{exit_code}`)',
              '- **Runner:** `backend/run_bdd.py` (Behave)',
              '- **Basis Data Uji:** PostgreSQL 16 (isolated CI service container)',
              '',
          ]

          if report_path.exists():
              try:
                  features = json.loads(report_path.read_text(encoding='utf-8'))
                  lines.append('## Ringkasan per Fitur & Skenario')
                  lines.append('')
                  lines.append('| Fitur | Skenario | Status | Durasi (s) |')
                  lines.append('| --- | --- | --- | ---: |')
                  for feat in features:
                      feat_name = feat.get('name', '-').replace('|', '\\|')
                      for elem in feat.get('elements', []):
                          if elem.get('type') == 'background':
                              continue
                          scen_name = elem.get('name', '-').replace('|', '\\|')
                          status = elem.get('status', 'unknown').upper()
                          badge = '✅ PASSED' if status == 'PASSED' else f'❌ {status}'
                          dur = sum(
                              ((s.get('result') or {}).get('duration') or 0.0)
                              for s in elem.get('steps', [])
                          )
                          lines.append(f'| {feat_name} | {scen_name} | {badge} | {dur:.3f} |')
                  lines.append('')
              except Exception as exc:
                  lines.append(f'> Gagal mem-parsing bdd-report.json: `{exc}`')
                  lines.append('')

          if console_path.exists():
              console_text = console_path.read_text(encoding='utf-8', errors='replace')
              lines.extend([
                  '<details>',
                  '<summary>Log Lengkap Eksekusi Behave (Klik untuk memperluas)</summary>',
                  '',
                  '```text',
                  console_text.rstrip(),
                  '```',
                  '</details>',
                  '',
              ])

          with summary_path.open('a', encoding='utf-8') as fh:
              fh.write('\n'.join(lines))
          EOF
        env:
          BDD_EXIT_CODE: ${{ steps.bdd.outputs.exit_code }}

      - name: Upload Sprint 1 BDD Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-1-bdd-test-results
          path: |
            backend/test-reports/bdd-console.log
            backend/test-reports/bdd-report.json
            backend/test-reports/junit/*.xml
          retention-days: 30
